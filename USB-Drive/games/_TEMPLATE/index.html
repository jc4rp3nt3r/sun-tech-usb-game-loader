<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Game</title>
<!--
  SUN TECH UNLIMITED — GAME TEMPLATE
  ----------------------------------
  1. Copy this whole _TEMPLATE folder and rename it after your game
     (lowercase, dashes instead of spaces — for example  laser-maze ).
  2. Build your game in here. Keep index.html as the file that starts it.
     Put images, sounds, and extra scripts in the same folder.
  3. Open the Game Grid and use "Add a game" — it writes your entry into
     games/games.json for you.

  Your game runs in a frame inside the Game Grid. Two rules that matter:
    · Esc is reserved. The Grid uses it to bring the player back to the menu.
    · Size to the frame, not the screen. Use 100% / vw / vh, and listen for
      the resize event, as the starter code below does.
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #04060D; color: #E9EEFA;
    font-family: 'Chakra Petch', 'Bahnschrift', system-ui, sans-serif;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute; top: 14px; left: 16px; z-index: 2;
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #5C6B8C;
  }
  #hud b { color: #fff; margin-left: 6px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Score<b id="score">0</b></div>

<script>
(() => {
'use strict';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const scoreEl = document.getElementById('score');

/* --- size the canvas to the frame, at the right pixel density ----------- */
let W = 0, H = 0;
function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = c.clientWidth; H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit);
fit();

/* --- your game state ---------------------------------------------------- */
const player = { x: 0, y: 0, r: 16, vx: 0, vy: 0 };
let score = 0;
const keys = new Set();

addEventListener('keydown', e => {
  if (e.key === 'Escape') return;          // leave Esc alone — the Grid needs it
  keys.add(e.key.toLowerCase());
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

/* --- update: runs once per frame ---------------------------------------- */
function update() {
  const speed = 0.6, friction = 0.9;
  if (keys.has('arrowleft')  || keys.has('a')) player.vx -= speed;
  if (keys.has('arrowright') || keys.has('d')) player.vx += speed;
  if (keys.has('arrowup')    || keys.has('w')) player.vy -= speed;
  if (keys.has('arrowdown')  || keys.has('s')) player.vy += speed;

  player.vx *= friction; player.vy *= friction;
  player.x += player.vx; player.y += player.vy;

  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));
}

/* --- draw: paint the current state -------------------------------------- */
function draw() {
  ctx.fillStyle = '#04060D';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(34,232,255,.06)';
  ctx.beginPath();
  for (let x = 0; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fillStyle = '#FF6A00';
  ctx.shadowColor = '#FF6A00';
  ctx.shadowBlur = 28;
  ctx.fill();
  ctx.shadowBlur = 0;
}

/* --- the loop ----------------------------------------------------------- */
function loop() {
  requestAnimationFrame(loop);
  update();
  draw();
}

player.x = 100; player.y = 100;
loop();
})();
</script>
</body>
</html>
