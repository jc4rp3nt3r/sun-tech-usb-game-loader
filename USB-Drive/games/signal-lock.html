<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal Lock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060D;overflow:hidden;color:#E9EEFA;
  font-family:'Chakra Petch','Bahnschrift',system-ui,sans-serif;
  display:grid;place-content:center;text-align:center}
#wrap{width:min(760px,90vw);display:flex;flex-direction:column;gap:26px;align-items:center}
h1{margin:0;font-size:clamp(1.6rem,5vw,3rem);font-weight:700;letter-spacing:.08em;
  background:linear-gradient(90deg,#22E8FF,#7A2CC4 50%,#FF1E6F);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(34,232,255,.45))}
#track{position:relative;width:100%;height:76px;background:#080D18;border:1px solid #17203A;
  overflow:hidden;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
#zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(255,106,0,.32),rgba(255,106,0,.12));
  border-left:2px solid #FF6A00;border-right:2px solid #FF6A00;box-shadow:0 0 30px rgba(255,106,0,.55)}
#core{position:absolute;top:0;bottom:0;width:5px;background:#fff;box-shadow:0 0 22px 4px #22E8FF}
#ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(34,232,255,.14) 0 1px,transparent 1px 30px)}
#stats{display:flex;gap:30px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5C6B8C}
#stats b{color:#fff;margin-left:7px;font-size:15px;font-variant-numeric:tabular-nums}
#say{margin:0;min-height:1.6em;font-size:1.05rem;color:#93A3C2;letter-spacing:.04em}
.keys{margin:0;font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.1em;
  color:#5C6B8C;text-transform:uppercase}
.flash{animation:f .3s}@keyframes f{0%{filter:brightness(2.4)}100%{filter:none}}
</style>
</head>
<body>
<div id="wrap">
  <h1>SIGNAL LOCK</h1>
  <div id="track"><div id="ticks"></div><div id="zone"></div><div id="core"></div></div>
  <p id="say">Stop the carrier inside the lock window. It gets narrower every time.</p>
  <div id="stats"><span>Locks<b id="locks">0</b></span><span>Best<b id="best">0</b></span><span>Lives<b id="lives">3</b></span></div>
  <p class="keys">Space or Enter to lock · Esc for the grid</p>
</div>
<script>
(() => {
'use strict';
const track=document.getElementById('track'),zone=document.getElementById('zone'),core=document.getElementById('core');
const say=document.getElementById('say'),locksEl=document.getElementById('locks'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives');

let pos=0,dir=1,speed=.55,width=26,locks=0,lives=3,best=Number(localStorage.getItem('sl-best')||0),zoneX=40,running=true;
bestEl.textContent=best;

function place(){
  const w=track.clientWidth;
  zoneX=10+Math.random()*(80-width-20);      // percentages
  zone.style.left=zoneX+'%';
  zone.style.width=width+'%';
}

function frame(){
  requestAnimationFrame(frame);
  if(!running)return;
  pos+=dir*speed;
  if(pos>=100){pos=100;dir=-1;}
  if(pos<=0){pos=0;dir=1;}
  core.style.left=pos+'%';
}
requestAnimationFrame(frame);

function attempt(){
  if(!running){restart();return;}
  const inside=pos>=zoneX&&pos<=zoneX+width;
  track.classList.remove('flash');void track.offsetWidth;track.classList.add('flash');
  if(inside){
    locks++;locksEl.textContent=locks;
    if(locks>best){best=locks;bestEl.textContent=best;
      try{localStorage.setItem('sl-best',best);}catch{}}
    const centre=Math.abs(pos-(zoneX+width/2))/(width/2);
    say.textContent=centre<.18?'Dead centre. Clean lock.':centre<.6?'Locked.':'Locked, barely.';
    width=Math.max(5,width*.9);
    speed=Math.min(speed*1.09,2.4);
    place();
  }else{
    lives--;livesEl.textContent=Math.max(lives,0);
    say.textContent=lives>0?'Missed. Carrier drifted.':'';
    if(lives<=0){
      running=false;
      say.innerHTML=`<strong style="color:#FF1E6F">Signal lost at ${locks} lock${locks===1?'':'s'}.</strong> Press Space to try again.`;
    }
  }
}

function restart(){
  pos=0;dir=1;speed=.55;width=26;locks=0;lives=3;running=true;
  locksEl.textContent=0;livesEl.textContent=3;
  say.textContent='Stop the carrier inside the lock window. It gets narrower every time.';
  place();
}

addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){e.preventDefault();attempt();}
});
addEventListener('pointerdown',attempt);
addEventListener('resize',place);
place();
})();
</script>
</body>
</html>
