<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<div id="hud">
  <span class="tag" style="--c:#22E8FF">YOU</span><b id="score">0</b>
  <span class="sep"></span>
  <span class="lbl">Round</span><b id="round">1</b>
</div>
<div id="msg">
  <h1>GRID RUNNER</h1>
  <p>Outrun two hostile programs. The wall you die on is the one you drew.</p>
  <p class="keys">Arrow keys or W A S D to turn · Space to start</p>
</div>
<script src="game.js"></script>
</body>
</html>
